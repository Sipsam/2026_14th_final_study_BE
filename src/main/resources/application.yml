spring:
  application:
    name: final-study

  datasource:
    url: jdbc:mysql://localhost:3306/final_study_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret-key: your-secret-key-your-secret-key-your-secret-key
  access-token:
    header: Authorization
    expiration: 3600000

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  show-actuator: true

logging:
  level:
    root: INFO
    com.likelion.finalstudy: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
