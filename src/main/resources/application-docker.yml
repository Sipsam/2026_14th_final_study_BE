spring:
  application:
    name: final

  datasource:
    url: jdbc:mysql://mysql:3306/final_study_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: docker_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: true

jwt:
  # NOTE: Docker 환경 설정. 실제 서비스에서는 환경변수/시크릿 매니저로 분리하세요.
  secret-key: your-secret-key-your-secret-key-your-secret-key
  access-token:
    header: Authorization
    expiration: 3600000
  refresh-token:
    expiration: 1209600000

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  show-actuator: true

logging:
  level:
    root: INFO
    com.likelion.finalstudy: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
