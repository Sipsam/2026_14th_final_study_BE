spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret-key: test-secret-key-test-secret-key-test-secret-key-123456
  access-token:
    header: Authorization
    expiration: 3600000
  refresh-token:
    expiration: 1209600000

logging:
  level:
    root: INFO
    com.likelion.finalstudy: DEBUG


