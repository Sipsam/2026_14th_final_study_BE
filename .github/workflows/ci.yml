name: Backend CI

on:
  push:
    branches:
      - 'week8/#6-jangsungwon'
  pull_request:
    branches:
      - 'week8/#6-jangsungwon'

jobs:
  build-and-test:
    name: Build and Test with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25 and Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Clean Build (Includes Tests with test Profile/H2)
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew clean build
