version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: final_study_mysql
    environment:
      MYSQL_ROOT_PASSWORD: docker_mysql_password
      MYSQL_DATABASE: final_study_db
      MYSQL_PORT: 3306
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdocker_mysql_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - final_study_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: final_study_app
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - final_study_network

volumes:
  mysql_data:

networks:
  final_study_network:
    driver: bridge

